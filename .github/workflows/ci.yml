name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  os:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        # Git Bash on Windows: the same commands and globs on every system.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist/src is committed and up to date
        # Windows checks out CRLF line endings.
        if: matrix.os != 'windows-latest'
        run: git diff --exit-code -- dist/src || (echo "::error::Run npm run build and commit dist/src" && exit 1)
      - name: Browser
        run: |
          exe=$(node -e 'import("./dist/src/browsers.js").then(m => console.log(m.pickBrowser().executable))')
          echo "$exe"
          # On Windows chrome.exe --version opens a browser window instead of printing.
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "(Get-Item '$exe').VersionInfo.ProductVersion"
          else
            "$exe" --version
          fi
      - run: node --test --test-concurrency=1 dist/test/*.test.js
      - name: One version everywhere, with a CHANGELOG.md entry
        if: matrix.os == 'ubuntu-latest'
        run: |
          v=$(node -p 'require("./package.json").version')
          test "$(node -p 'require("./package-lock.json").version')" = "$v" || { echo "::error::package-lock.json is not $v: run npm install"; exit 1; }
          test "$(node -p 'require("./.claude-plugin/plugin.json").version')" = "$v" || { echo "::error::.claude-plugin/plugin.json is not $v"; exit 1; }
          node .github/scripts/release-notes.mjs "$v" > /dev/null
      - name: Plugin manifests
        if: matrix.os == 'ubuntu-latest'
        # @latest: without a version npx runs the copy in the npm cache setup-node restores, so a
        # check a newer Claude Code adds went unnoticed.
        run: |
          npx -y @anthropic-ai/claude-code@latest --version
          npx -y @anthropic-ai/claude-code@latest plugin validate --strict .

  # The required check on main is "test": one result for all systems.
  test:
    needs: os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.os.result }}" = success
